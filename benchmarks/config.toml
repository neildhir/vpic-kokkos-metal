nx = 128
ny = 128
nz = 128
total_particles = 12000000
nstep = 40
sort_interval = 0

[presets]
smoke = ["2d-smoke", "3d-smoke"]
small = ["2d-small", "3d-small"]
medium = ["2d-medium", "3d-medium"]
large = ["2d-large", "3d-large"]
lpi-smoke = ["lpi-smoke-24", "lpi-smoke-64"]
lpi-sweep = ["lpi-16", "lpi-24", "lpi-34", "lpi-44", "lpi-64", "lpi-96", "lpi-128"]

# Published GPU push rates for the LPI sweep (pushes per ns; "text" = stated in
# the paper's text, "figure" = read off Fig. 9 by eye). Not used by the
# harness; for plots and comparisons.
[published_push_rate]
citation = "Tan, Luedtke, Taufer, Albright, SC Workshops '25, doi:10.1145/3731599.3767493, Fig. 9 (LPI benchmark, sorting disabled, fixed particle count, push time only)"

[[published_push_rate.points]]
gpu = "V100"
grid_points = 13824
pushes_per_ns = 4.0
source = "text"

